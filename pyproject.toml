[project]
name = "k2cascade"
version = "0.0.1"
description = "Per-step cascade agent runner across the K2 Horizon family, with labeled step traces."
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "httpx>=0.27", "rich>=13"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
