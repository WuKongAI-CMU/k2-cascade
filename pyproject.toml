[project]
name = "k2cascade"
version = "0.0.1"
description = "Per-step cascade agent runner across the K2 Horizon family, with labeled step traces."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "rich>=13",
    "mlx-lm>=0.31.3",
    "huggingface-hub>=1.31.0",
    "numpy>=2.4.6",
    "scikit-learn",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
data = [
    "datasets>=5.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
