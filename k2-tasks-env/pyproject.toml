[project]
name = "k2-tasks-env"
version = "0.1.0"
description = "Four small, verifiable coding tasks packaged as a reward-hacking-resistant RL environment (OpenEnv-style API, verifiers adapter)."
requires-python = ">=3.11"
dependencies = ["pytest>=8"]

[project.optional-dependencies]
verifiers = ["verifiers>=0.3", "datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
